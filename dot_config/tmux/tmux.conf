set -g mouse on
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-features ',xterm-256color:RGB'

set -g history-limit 1000000

set -g status-position bottom
set -g status-style "bg=default,fg=#808080"
set -g status-left " #[fg=#c0c0c0]#S #[fg=#404040]│ "
set -g status-left-length 30
set -g status-right "#[fg=#404040]│ #[fg=#808080]%H:%M "
set -g status-right-length 20

setw -g window-status-format " #[fg=#606060]#I #W "
setw -g window-status-current-format " #[fg=#ffffff]#I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#606060"
set -g message-style "bg=default,fg=#c0c0c0"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"
if-shell "grep -qi microsoft /proc/version" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip.exe'"
bind-key -T copy-mode-vi Escape send-keys -X cancel
